name: ARC-AGI-3 Live Smoke Test

on:
  push:
    branches:
      - feat/arc-agi-3-emoji-solver
    paths:
      - "arc3/**"
      - ".github/workflows/arc3-live-smoke.yml"
  workflow_dispatch:
    inputs:
      game_id:
        description: "Public ARC-AGI-3 game id"
        required: true
        default: "ls20"
        type: string
      max_actions:
        description: "Maximum actions for this bounded smoke run"
        required: true
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official ARC-AGI-3 toolkit
        run: python -m pip install --upgrade pip arc-agi
      - name: Run bounded live environment smoke test
        env:
          GAME_ID: ${{ inputs.game_id || 'ls20' }}
          MAX_ACTIONS: ${{ inputs.max_actions || '8' }}
        run: |
          set -o pipefail
          timeout 180s python -m arc3.arc_agi_runner \
            --game-id "$GAME_ID" \
            --max-actions "$MAX_ACTIONS" \
            --click-strategy foreground \
            --max-click-points 16 \
            --save-recording > arc3-live-smoke.json 2>&1
          status=$?
          cat arc3-live-smoke.json
          exit "$status"
      - name: Upload run result and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-live-smoke-${{ github.run_id }}
          path: |
            arc3-live-smoke.json
            recordings/**
          if-no-files-found: warn
          retention-days: 14
