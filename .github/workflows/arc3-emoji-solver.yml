name: ARC-AGI-3 Glyph Solver CI

on:
  push:
    paths:
      - "arc3/**"
      - "tests/test_arc3_*.py"
      - ".github/workflows/arc3-emoji-solver.yml"
  pull_request:
    paths:
      - "arc3/**"
      - "tests/test_arc3_*.py"
      - ".github/workflows/arc3-emoji-solver.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all ARC-AGI-3 modules
        run: python -m compileall -q arc3
      - name: Run ARC-AGI-3 unit tests
        run: python -m unittest discover -s tests -p 'test_arc3_*.py' -v
      - name: Standalone emoji CLI smoke test
        run: |
          printf '%s\n' '{"observation":{"grid":[[0,1]]},"legal_actions":[{"button":"left"}]}' |
            python arc3/emoji_solver.py
      - name: Verify SDK runner reports missing optional dependency cleanly
        run: |
          set +e
          python -m arc3.arc_agi_runner > runner-output.txt 2>&1
          status=$?
          cat runner-output.txt
          test "$status" -eq 2
          grep -q "Missing optional dependency:" runner-output.txt
