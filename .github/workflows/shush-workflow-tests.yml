name: SHUSH workflow prototype checks

on:
  push:
    paths:
      - "tools/workflow_engine.py"
      - "tools/benchmark_report.py"
      - "tools/validate_benchmark_tasks.py"
      - "tools/generate_c_registry.py"
      - "tools/export_benchmark_prompts.py"
      - "c/generated_registry.h"
      - "tests/test_workflow_engine.py"
      - "tests/test_benchmark_report.py"
      - "benchmarks/**"
      - "c/**"
      - "registry/**"
      - "examples/**"
      - "tools/validate_registry.py"
      - ".github/workflows/shush-workflow-tests.yml"
  pull_request:
    paths:
      - "tools/workflow_engine.py"
      - "tools/benchmark_report.py"
      - "tools/validate_benchmark_tasks.py"
      - "c/**"
      - "benchmarks/**"
      - "tools/benchmark_report.py"
      - "tests/test_workflow_engine.py"
      - "tests/test_benchmark_report.py"
      - "registry/**"
      - "examples/**"
      - "tools/validate_registry.py"
      - ".github/workflows/shush-workflow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry and vocabulary
        run: python tools/validate_registry.py
      - name: Run workflow engine tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run emoji workflow example
        run: python tools/workflow_engine.py
      - name: Generate and verify C registry
        run: |
          python tools/generate_c_registry.py --check
      - name: Compile C capability VM
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic c/shush_capability_vm.c -o /tmp/shush-capvm
      - name: Run C capability VM self-tests
        run: /tmp/shush-capvm --self-test
      - name: Validate benchmark task definitions
        run: python tools/validate_benchmark_tasks.py benchmarks/shush_20_tasks.json
      - name: Export benchmark prompts
        run: |
          python tools/export_benchmark_prompts.py --output /tmp/shush_20_prompts.jsonl
          test "$(wc -l < /tmp/shush_20_prompts.jsonl)" -eq 60
