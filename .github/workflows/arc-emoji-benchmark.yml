name: ARC emoji baseline

on:
  push:
    branches: [main, "feat/arc-agi-3-emoji-pipeline"]
    paths:
      - "arc_emoji/**"
      - "tests/test_arc_emoji_solver.py"
      - "tools/benchmark_arc_emoji.py"
      - ".github/workflows/arc-emoji-benchmark.yml"
  pull_request:
    paths:
      - "arc_emoji/**"
      - "tests/test_arc_emoji_solver.py"
      - "tools/benchmark_arc_emoji.py"
      - ".github/workflows/arc-emoji-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ARC emoji unit tests
        run: python -m unittest discover -s tests -p 'test_arc_emoji_solver.py' -v
      - name: Run seeded synthetic benchmark
        run: python tools/benchmark_arc_emoji.py | tee arc-emoji-benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: arc-emoji-synthetic-benchmark
          path: arc-emoji-benchmark.json
